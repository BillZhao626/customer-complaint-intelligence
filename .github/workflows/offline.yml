name: Offline product checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  product:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      LLM_ENABLE_API: 'false'
      COMPLAINT_ENABLE_LIVE: 'false'
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      LANGCHAIN_TRACING: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python -B scripts/audit_release.py --ref HEAD --history --output .local/ci-release-audit.json
      - run: npm ci
        working-directory: web-client
      - run: npm test
        working-directory: web-client
      - run: npm run build
        working-directory: web-client
      - run: npm audit --audit-level=high
        working-directory: web-client
      - run: python -B tests/run_offline.py
      - run: python -B verify_review.py
